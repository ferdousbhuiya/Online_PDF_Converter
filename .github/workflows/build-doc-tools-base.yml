name: Build document tools base image

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile.base
      - .github/workflows/build-doc-tools-base.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push reusable base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ghcr.io/ferdousbhuiya/pdf-doc-tools-base:py311
            ghcr.io/ferdousbhuiya/pdf-doc-tools-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
