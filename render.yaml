services:
  - type: web
    name: pdfmaster-pro
    env: python
    buildCommand: |
      apt-get update -qq
      apt-get download poppler-utils 2>/dev/null || echo "download_failed"
      dpkg -x poppler-utils_*.deb ./poppler-bin/ 2>/dev/null && echo "POPPLER_EXTRACTED" || echo "POPPLER_FAILED"
      pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
